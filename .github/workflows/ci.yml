name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build everything
        run: bazel build //...

      - name: Unit tests (no GPU needed)
        run: bazel test //engine/... --test_output=errors

      - name: Integration tests (offscreen Metal, exclusive)
        run: bazel test //tests/... //apps/... --test_output=errors --local_test_jobs=1
